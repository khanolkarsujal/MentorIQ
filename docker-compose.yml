version: "3.9"

services:
  web:
    build: .
    container_name: mentoriq_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app/frontend:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mentoriq_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
